name: build-console

# Triggers: push to main when console sources or this workflow change.
# PRs that touch the same paths run lint + tests + build but do not push.
#
# GHCR image: ghcr.io/scality/artesca-vss-console
# Two tags on push to main:
#   :latest
#   :sha-<7-char short SHA>
# The test sources and their configs are in the path list because this workflow
# is what runs them: without them a test-only change never triggers the job that
# would have checked it, and the suite's own state goes unverified until the next
# src/ commit happens to carry it.
#
# `scripts/copy-monaco.mjs` is listed by name, not as `scripts/**`, and anything
# else this workflow comes to depend on should be added the same way. It runs
# from the `prebuild` and `pretest:e2e` hooks, so it decides whether the build
# and the E2E run have a Monaco to serve at all — a change to it can turn CI red
# without touching a path above. The directory is deliberately not wildcarded:
# `build-and-push` republishes `:latest` on every matching push to main, and a
# diagram-generator edit should not hand the labs a new image.
# `workflow_dispatch` exists because a push is otherwise the only trigger, and a
# push is not always available when you need a run. During the GitHub Actions
# outage of 2026-08-06 every queued run for seven consecutive commits was
# cancelled with zero steps executed, and there was then no way to re-run CI for
# the commit that had shipped without manufacturing an empty commit to move a
# path in the list below. Dispatch runs against a ref, so `--ref main` covers
# whatever is currently HEAD.
#
# A dispatched run performs `ci` only. `build-and-push` is gated on
# `github.event_name == 'push'`, so no image is published and `:latest` does not
# move — deliberately, since a tag that shifts without a commit behind it is
# hard to reason about later. Dispatch answers "does this pass", not "give me an
# image"; for an image, push to main, or build it locally with
# `docker build -t artesca-vss-console:local .` (the same Dockerfile this job
# uses). Scality's labs build and sideload it from their own tooling.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/copy-monaco.mjs"
      # The optional-telemetry presence check and its installer: a VERSION bump
      # or a change to either decides whether the SDK is in the image at all,
      # and neither would otherwise trigger a run.
      - "telemetry-optional.cjs"
      - "scripts/enable-telemetry.mjs"
      # Same for the optional Firestore SDK — the config-store backend the image
      # can serve is decided at build time by whether it is installed.
      - "firestore-optional.cjs"
      - "scripts/enable-firestore.mjs"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/build-console.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/copy-monaco.mjs"
      # The optional-telemetry presence check and its installer: a VERSION bump
      # or a change to either decides whether the SDK is in the image at all,
      # and neither would otherwise trigger a run.
      - "telemetry-optional.cjs"
      - "scripts/enable-telemetry.mjs"
      # Same for the optional Firestore SDK — the config-store backend the image
      # can serve is decided at build time by whether it is installed.
      - "firestore-optional.cjs"
      - "scripts/enable-firestore.mjs"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/build-console.yml"

concurrency:
  group: build-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned: ubuntu-latest became Ubuntu 26.04, on which Playwright installs no Chromium ("Playwright does not support
    # chromium on ubuntu26.04-x64", run 40723961222, 2026-10-28).
    runs-on: ubuntu-24.04

    steps:
      # Shallow clone — full history not needed for lint/test/build.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest CI mode)
        run: npm run test -- --run

      # `next build` with output: "standalone" also performs tsc type-checking.
      # A non-zero exit here catches TS errors before the Docker build.
      - name: Build (type-check + Next.js build)
        run: npm run build

      # playwright.config.ts webServer boots `npm run start` in CI (port :8800)
      # using the .next output from the preceding build step — no separate server
      # start needed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          CI: "1"
          # Auth.js v5 refuses any host it was not told to trust, and rejects
          # every /api/auth/session call with UntrustedHost when it is not
          # running on Vercel. The webServer here is a plain `npm run start` on
          # localhost:8800, so without this the whole E2E suite fails at sign-in.
          AUTH_TRUST_HOST: "true"
          # The specs reach pages behind `src/proxy.ts`, which redirects to
          # /sign-in unless `req.auth` is set. They stub `/api/auth/session` with
          # `page.route`, and that is a browser-level intercept the middleware
          # never sees — so the bypass is what actually makes those pages
          # reachable, exactly as it does for a local run. auth.spec.ts still
          # covers the real sign-in page, which is a PUBLIC_PATH and renders
          # either way; no spec exercises a genuine session, here or locally.
          CONSOLE_DISABLE_AUTH: "true"
          # A throwaway value: it signs cookies for a localhost server that is
          # torn down with the job, and nothing it protects outlives the run.
          # It has to be set all the same. Auth.js requires a secret under
          # NODE_ENV=production, which `next start` sets, and answers a missing
          # one by refusing every request — so leaving it unset makes the run
          # depend on how a given @auth/core version handles the failure rather
          # than on the app.
          AUTH_SECRET: "e2e-only-not-a-real-secret-torn-down-with-the-job"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-and-push:
    needs: ci
    # Only run on push to main — skip on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Compute the short SHA for the image tag.
      # GITHUB_SHA is a fixed 40-char hex string set by GitHub Actions — safe
      # to slice via shell parameter expansion.
      - name: Compute short SHA
        id: sha
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GCP auth for the Sentry build creds (Secret Manager). Fail-soft:
      # continue-on-error so a missing WIF secret doesn't fail the build — the
      # image just ships without source-map upload.
      - id: gcp-auth
        name: Authenticate to GCP (Sentry build creds)
        uses: google-github-actions/auth@v3
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      # Source-map upload creds live in Secret Manager as env-file lines
      # (SENTRY_AUTH_TOKEN / SENTRY_ORG). SENTRY_PROJECT is fixed to the console
      # project; SENTRY_RELEASE is the pushed short SHA (matches the image tag).
      - id: sentry
        name: Fetch Sentry build creds (fail-soft)
        if: steps.gcp-auth.outcome == 'success'
        run: |
          if gcloud secrets versions access latest --secret=isv-labs-sentry-build-env --project=isv-alliances >/tmp/sentry.env 2>/dev/null; then
            TOKEN=$(sed -n 's/^SENTRY_AUTH_TOKEN=//p' /tmp/sentry.env)
            ORG=$(sed -n 's/^SENTRY_ORG=//p' /tmp/sentry.env)
            echo "::add-mask::${TOKEN}"
            echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
            echo "org=${ORG}" >> "$GITHUB_OUTPUT"
            echo "Sentry build creds loaded (org=${ORG})"
          else
            echo "WARN: isv-labs-sentry-build-env not found — building without source-map upload"
          fi
          rm -f /tmp/sentry.env

      # Log in to GHCR using the GITHUB_TOKEN — no personal access token needed.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the multi-stage console image.
      # context: . — the console is the repository root.
      # cache-from/cache-to: GitHub Actions cache for layer reuse across runs.
      # build-args + secrets carry the Sentry source-map upload creds into the
      # in-image `next build` (empty when the fetch step was skipped → upload
      # skipped, build still succeeds).
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/scality/artesca-vss-console:latest
            ghcr.io/scality/artesca-vss-console:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # WITH_TELEMETRY=1 installs the optional Sentry SDK inside the image.
          # It is in no dependency field, so the Dockerfile's `npm ci` does not
          # bring it (telemetry-optional.cjs explains why). This published image is
          # what the labs run, so it opts in; a third-party build of the same
          # Dockerfile leaves the arg unset and gets no source-available dependency.
          #
          # A side effect worth keeping: the two jobs now cover both paths at no
          # extra cost. `ci` installs with npm ci and no arg, so it proves the app
          # type-checks, tests, builds and E2Es with the SDK absent; this job proves
          # the withSentryConfig path still works.
          #
          # WITH_FIRESTORE=1 is the same arrangement for the config store. The
          # default backend is a YAML file, so the SDK is in no dependency field
          # either — but every lab already deployed has its cameras, prompt-sets
          # and scenarios in Firestore, so the published image has to be able to
          # read them. `ci` covers the absent path, this job the present one.
          build-args: |
            SENTRY_ORG=${{ steps.sentry.outputs.org }}
            SENTRY_PROJECT=scality-vss-console-ui
            SENTRY_RELEASE=sha-${{ steps.sha.outputs.short }}
            WITH_TELEMETRY=1
            WITH_FIRESTORE=1
          secrets: |
            sentry_auth_token=${{ steps.sentry.outputs.token }}

      # Print the pushed image ref and a ready-to-use kubectl rollout command.
      - name: Print image ref and rollout hint
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          IMAGE="ghcr.io/scality/artesca-vss-console:sha-${SHORT_SHA}"
          echo "Pushed: ${IMAGE}"
          echo ""
          echo "To deploy on the ARTESCA node:"
          echo "  kubectl set image deployment/console console=${IMAGE} -n console"
          echo "  kubectl rollout status deployment/console -n console"

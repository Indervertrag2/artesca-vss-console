apiVersion: v1
kind: ConfigMap
metadata:
  name: console-env
  namespace: console
data:
  # ── Helm layout profile ───────────────────────────────────────────────────────
  # VSS_NAMESPACE: Helm release namespace. All VSS services run here.
  #   Format: vss-<profile>  (e.g. vss-base, vss-alerts, vss-dev-profile-alerts)
  #   Drives: Kafka brokers, Redis URL, VST sensor/ingress URLs, restartable map.
  #   deploy-console.sh renders this from SCALITY_BP_PROFILE (default: base).
  VSS_NAMESPACE: "vss-base"

  # CONSOLE_LEGACY_NAMESPACES: set to "1" to enable the pre-Helm namespace layout
  # (vst / rtvi / agent / alerts). Unset or "0" = Helm layout (default).
  # CONSOLE_LEGACY_NAMESPACES: "0"

  # ── Cameras namespace ─────────────────────────────────────────────────────────
  # The `cameras` ConfigMap and register-cameras Jobs live outside the Helm
  # release. Default is the Scality lab's namespace; point it at yours. That
  # namespace needs the console-writer Role (02-workload-rbac.yaml.example).
  # CAMERAS_NAMESPACE: "pyramid-ingress"

  # ── Namespaces the console monitors ──────────────────────────────────────────
  # Helm default: "<VSS_NAMESPACE>,<CAMERAS_NAMESPACE>"
  # Legacy override: "vst,rtvi,agent,alerts,<CAMERAS_NAMESPACE>"
  # Set explicitly only when the auto-derived value is wrong.
  # KUBE_NAMESPACES: ""

  # ── Kafka ─────────────────────────────────────────────────────────────────────
  # Helm: Confluent kafka-kafka headless service in vss-<profile>.
  #   Verified on live cluster 2026-05-11: kafka-kafka.<vss-ns>.svc.cluster.local:9092
  # Legacy: redpanda.rtvi.svc.cluster.local:9092
  # Auto-derived from VSS_NAMESPACE when unset — override only to pin explicitly.
  # KAFKA_BROKERS: "kafka-kafka.vss-base.svc.cluster.local:9092"

  # ── Redis ─────────────────────────────────────────────────────────────────────
  # Helm: redis.<vss-ns>.svc.cluster.local:6379
  # Legacy: redis://redis.vst.svc.cluster.local:6379
  # Auto-derived from VSS_NAMESPACE when unset.
  # REDIS_URL: "redis://redis.vss-base.svc.cluster.local:6379"

  # ── VST sensor API ────────────────────────────────────────────────────────────
  # Helm: vss-vios-sensor.<vss-ns>.svc.cluster.local:30000
  # Legacy: sensor-ms.vst.svc.cluster.local:30000
  # Auto-derived from VSS_NAMESPACE when unset.
  # VST_SENSOR_URL: "http://vss-vios-sensor.vss-base.svc.cluster.local:30000/api/v1/live/sensor"

  # ── ARTESCA S3 endpoint and bucket ───────────────────────────────────────────
  # Replace <base-domain> with the ARTESCA base domain used at install time
  # (the --base-domain flag passed to artesca-installer deploy).
  S3_ENDPOINT: "https://s3.<base-domain>"
  S3_BUCKET: "nvidia-vss-video"
  # OBJECTSTORE_REGION : the signing region the S3 client presents. ARTESCA does
  #                      not route on it, but the SDK requires one and the value
  #                      has to match what the endpoint accepts. Set explicitly
  #                      rather than left to the fallback in src/lib/s3.ts, so
  #                      the region is a choice someone made.
  #                      ⚠ Two defaults disagree if this is unset: s3.ts falls
  #                      back to "us-west-2" and cluster-refs.ts to "us-east-1".
  OBJECTSTORE_REGION: "us-west-2"
  # STORAGE_CAPACITY_BYTES : total storage capacity in BYTES, shown in the
  #                          Overview "Total Size" KPI as "<used> / <capacity>".
  #                          Unset or 0 = unknown (KPI renders used-only).
  #                          Example: 1 TiB = 1099511627776.
  # STORAGE_CAPACITY_BYTES: "1099511627776"

  # ── Camera-sim EC2 ───────────────────────────────────────────────────────────
  # CAMERA_SIM_HOST      : public IP or DNS name of the camera-sim instance.
  #                        Also used as the mediamtx host (port 9997) unless
  #                        MEDIAMTX_API_URL is set explicitly.
  # CAMERA_SIM_SSH_USER  : OS user on the camera-sim instance (Ubuntu AMI default).
  # CAMERA_SIM_SSH_KEY_PATH: path inside the console pod to the mounted SSH key.
  CAMERA_SIM_HOST: "<camera-sim-public-ip>"
  CAMERA_SIM_SSH_USER: "ubuntu"
  CAMERA_SIM_SSH_KEY_PATH: "/etc/camera-sim/id_ed25519"

  # mediamtx REST API base URL (port 9997 on the camera-sim host).
  # Defaults to http://<CAMERA_SIM_HOST>:9997 if not set.
  # MEDIAMTX_API_URL: "http://<camera-sim-public-ip>:9997"
  # The API needs basic auth: user `camsim` (MEDIAMTX_API_USER to override), password
  # CAMSIM_PASS from the console-auth Secret (k8s/10-secrets.yaml.example).

  # ── Alert worker ─────────────────────────────────────────────────────────────
  # Helm: vss-video-analytics-api.<vss-ns>.svc.cluster.local:9101
  # Legacy: alert-worker.alerts.svc.cluster.local:9101
  # Auto-derived from VSS_NAMESPACE when unset.
  # ALERT_WORKER_URL: "http://vss-video-analytics-api.vss-base.svc.cluster.local:9101"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  # metalk8s-monitoring's kube-prometheus-stack — NOT artesca-monitoring.
  # artesca-monitoring's Prometheus CR has serviceMonitorSelector=null (no dynamic
  # ServiceMonitor discovery) and holds 0 GPU series; metalk8s-monitoring is the
  # one that scrapes the observability/ DCGM ServiceMonitor (DCGM_FI_DEV_GPU_*).
  PROMETHEUS_URL: "http://prometheus-operated.metalk8s-monitoring.svc.cluster.local:9090"

  # ── Grafana (historical GPU graphs link surfaced on the Overview page) ──────────
  # ARTESCA's Grafana behind the :8443 shell-UI ingress. <base-domain> is the
  # ARTESCA --base-domain (substituted by deploy-console.sh, same as S3_ENDPOINT).
  GRAFANA_URL: "https://<base-domain>:8443/"

  # ── Config store (k8s path) ──────────────────────────────────────────────────
  # VSS_INSTANCE_NAME: which instance's config the console reads/writes. Names the
  #   YAML file ($CONSOLE_DATA_DIR/config-store/<name>.yaml) on the file backend,
  #   and the document path (instances/<name>/{prompt,cameras,scenarios}) on
  #   Firestore. Placeholder is substituted with the real instance name by
  #   deploy-console.sh (same mechanism as CAMERA_SIM_HOST).
  VSS_INSTANCE_NAME: "<vss-instance-name>"
  # CONSOLE_CONFIG_STORE: which backend — "file" (default) or "firestore".
  #
  #   ⚠ Unset is NOT the same as "file". With FIRESTORE_PROJECT_ID set and this
  #   unset, the console infers "firestore", deliberately: every instance
  #   deployed before ISVD-606 has its cameras, prompt-sets and scenarios in
  #   Firestore, and the ordinary way to ship a new build to one of those is
  #   `kubectl set image`, which does not touch this ConfigMap. A flat default
  #   would bring that pod up on an empty YAML file with no error at all.
  #   /about says when the backend was inferred rather than chosen.
  #
  #   The file backend needs CONSOLE_DATA_DIR to be a volume EVERY writer mounts
  #   — the console pod and the reconcile-agent pod both write. A store on a
  #   container filesystem is one private copy per pod, which fails silently.
  CONSOLE_CONFIG_STORE: "file"
  # FIRESTORE_PROJECT_ID: the GCP project holding the store, for the firestore
  #   backend only. No default in the image: a hardcoded one named a single
  #   organisation's project, so any other build went looking for its cameras,
  #   prompt and scenarios in an account it cannot read and failed with a
  #   permission error instead of "unconfigured" (ISVD-607). Left empty here
  #   because this repository is public; deploy-console.sh fills it, the same
  #   mechanism as CAMERA_SIM_HOST.
  FIRESTORE_PROJECT_ID: ""
  # Firestore credentials — mounted from the config-store-rw secret (see
  # 20-console.yaml). Fixed path, same as the reconcile-agent. Unused by the
  # file backend.
  GOOGLE_APPLICATION_CREDENTIALS: "/etc/config-store/key.json"
  # Set to "1" ONLY when a dedicated reconcile-agent (RECONCILE_AGENT=1) is
  # deployed to own store→cluster convergence. Unset/"0" = the console runs
  # the periodic convergence loop itself (correct for single-pod deploys). The
  # one-shot startup convergence runs regardless of this flag — so the console is
  # a config-store writer either way, which is why the file backend locks.
  CONSOLE_DISABLE_RECONCILE_LOOP: "0"

  # ── Local state directory ─────────────────────────────────────────────────────
  # Backed by PVC console-data (5 Gi, ReadWriteOnce). Holds the SQLite database
  # and, on the file backend, config-store/<instance>.yaml.
  CONSOLE_DATA_DIR: "/data"

  # ── NIM preview endpoint ──────────────────────────────────────────────────────
  # Helm: nvila-lite-preview.<vss-ns>.svc.cluster.local:8000
  # Legacy: nvila-lite-preview.rtvi.svc.cluster.local:8000
  # Auto-derived from VSS_NAMESPACE when unset.
  # NIM_PREVIEW_ENDPOINT: "http://nvila-lite-preview.vss-base.svc.cluster.local:8000"

  # ── Model catalog ─────────────────────────────────────────────────────────────
  # Drives which card in console/src/data/model-catalog.json is rendered as
  # primary / preview on the Prompt page.
  NIM_CURRENT_MODEL: "nvidia-nemotron-nano-9b-v2"
  NIM_PREVIEW_MODEL: "nvila-lite-2b"

  # ── Sentry observability (optional) ──────────────────────────────────────────
  # Telemetry is OFF unless a DSN is supplied here. The image carries none: the
  # same DSN was compiled into all three runtimes, so any other build reported
  # its errors into one organisation's Sentry project (ISVD-607). A DSN is an
  # ingest-only identifier rather than a credential, so this is not about
  # secrecy — a default destination someone inherits by accident is simply not
  # a default. deploy-console.sh fills these for the Scality labs.
  #   SENTRY_DSN            — server + edge runtime ingest.
  #   NEXT_PUBLIC_SENTRY_DSN — browser ingest (baked at build; override needs rebuild).
  # SENTRY_DSN: "https://<key>@<org>.ingest.<region>.sentry.io/<projectId>"
  # NEXT_PUBLIC_SENTRY_DSN: "https://<key>@<org>.ingest.<region>.sentry.io/<projectId>"

  # ── Auth.js ───────────────────────────────────────────────────────────────────
  # Must be reachable from inside the pod for callbacks. The cookie-signing
  # secret is AUTH_SECRET, and it comes from the console-auth Secret, not here.
  AUTH_URL: "http://console.console.svc.cluster.local:8800"
  CONSOLE_DISABLE_AUTH: "true"
  # Auth.js v5 behind the tunnel/ingress: trust the incoming host (no UntrustedHost 500)
  AUTH_TRUST_HOST: "true"

  # ── VSS Chat media proxy ──────────────────────────────────────────────────────
  # The vss-agent stamps snapshot/clip URLs with a host the browser can't reach
  # (its own VST_EXTERNAL_URL, "vss-agent:8000"). /api/chat rewrites that prefix
  # to this console's own /api/media proxy so a snapshot/clip opens with one
  # click. Auto-derived from VSS_NAMESPACE / VST_STORAGE_URL when unset.
  #
  # VSS_AGENT_MEDIA_HOST: "vss-agent:8000"        # host:port the agent stamps
  # VST_MEDIA_ORIGIN: "http://vss-vios-ingress.vss-base.svc.cluster.local:30888"
  #
  # Set to "0" to disable the rewrite (falls back to raw, browser-unreachable
  # agent URLs — useful for debugging the agent's own output).
  # VSS_MEDIA_PROXY_ENABLED: "1"
  #
  # VSS_AGENT_UI_URL: the upstream VSS agent UI as the operator's browser
  #   reaches it, behind /chat's "open upstream UI" button. No default: unset,
  #   or anything but an absolute http(s) URL, hides the button. Set it only
  #   where that UI is exposed to the operators (a ClusterIP service alone
  #   is not).
  # VSS_AGENT_UI_URL: "http://<host-the-operators-reach>:<port>"

  # ── Recording auto-heal (guarded re-arm on stalled VST recorder) ─────────────
  # The VST cloud recorder can silently stall — sessions stay alive but stop
  # producing segments while the source/VLM pipeline is fine. The reconcile
  # loop's recording-recovery pass probes each online sensor's ground-truth
  # recording status and re-arms (delete+re-add, same rtspUrl) a sensor stuck
  # not-recording past the stall threshold, gated by a cooldown + attempt cap
  # + per-cycle batch cap. See
  # docs/superpowers/specs/2026-07-04-vss-recording-recovery-design.md.
  #
  # RECORDING_AUTOHEAL_ENABLED: set to "0" to disable the recovery pass entirely.
  # RECORDING_AUTOHEAL_ENABLED: "1"
  #
  # RECORDING_STALL_THRESHOLD_MS: how long (ms) a sensor must read not-recording
  #   before it's eligible for a re-arm. Default 300000 (5 min).
  # RECORDING_STALL_THRESHOLD_MS: "300000"
  #
  # RECORDING_REARM_COOLDOWN_MS: minimum time (ms) between re-arm attempts on
  #   the same sensor. Default 600000 (10 min).
  # RECORDING_REARM_COOLDOWN_MS: "600000"
  #
  # RECORDING_REARM_MAX_ATTEMPTS: stop re-arming (mark degraded) once this many
  #   attempts have been made on a sensor. Default 3.
  # RECORDING_REARM_MAX_ATTEMPTS: "3"
  #
  # RECORDING_REARM_MAX_PER_CYCLE: cap on re-arms fired within a single
  #   reconcile pass (60s tick), across all sensors. Default 1.
  # RECORDING_REARM_MAX_PER_CYCLE: "1"
  #
  # RECORDING_ESCALATE_ENABLED: pod-restart escalation for pod-global recorder
  #   stalls (streamprocessing rollout); "0" disables escalation only. Default enabled.
  # RECORDING_ESCALATE_ENABLED: "1"
  #
  # RECORDING_ESCALATE_MIN_STALLED: min recoverable-stalled sensors to trigger a
  #   streamprocessing restart; keep > count of permanently-offline cams. Default 3.
  # RECORDING_ESCALATE_MIN_STALLED: "3"
  #
  # RECORDING_ESCALATE_COOLDOWN_MS: minimum time (ms) between escalation restarts.
  #   Default 300000 (5 min).
  # RECORDING_ESCALATE_COOLDOWN_MS: "300000"
  #
  # RECORDING_ESCALATE_MAX_RESTARTS: cap on escalation restarts before giving up
  #   (then per-sensor degraded stands). Default 2.
  # RECORDING_ESCALATE_MAX_RESTARTS: "2"

  # ── AI Factory GPU mode ───────────────────────────────────────────────────────
  # Read from ConfigMap <AI_FACTORY_NAMESPACE>/<AI_FACTORY_MODE_CONFIGMAP>
  # (default ai-factory/gpu-mode), written only by the AI Factory's GPU switch.
  # Mode other than `vss`: banner on every page (full-screen in kiosk), and the
  # console skips (reconcile loop) or 409s (restart/tuning/profile routes) writes
  # to vss-rtvi-vlm, vss-vios-streamprocessing and kvcache-demo/vllm-lmcache.
  # Absent ConfigMap or namespace = `vss`. console-reader's cluster-wide
  # configmaps `get` covers the read (01-rbac.yaml).
  # AI_FACTORY_URL: link to the AI Factory UI as the operator's browser reaches
  #   it (nav, pause banner, kiosk notice). No default: unset, or anything but
  #   an absolute http(s) URL, renders no AI Factory link at all, so set it only
  #   where the operators can open that address (e.g. the laptop end of the
  #   AI Factory's SSH tunnel). The pause banner shows either way.
  # AI_FACTORY_URL: "http://<host-the-operators-reach>:<port>"
  # AI_FACTORY_NAMESPACE: "ai-factory"
  # AI_FACTORY_MODE_CONFIGMAP: "gpu-mode"
